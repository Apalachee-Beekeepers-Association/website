singletons:
  - name: homepage
    label: Homepage
    icon: home
    file: /content/index.liquid
    media_folder: '{{media_folder}}/homepage'
    public_folder: '{{public_folder}}/homepage'
    fields:
      - name: hero
        label: Hero
        widget: object
        fields:
        - name: title
          label: Title
          widget: string
        - name: body
          label: Body
          widget: richtext
        - name: cta
          label: Call to Action
          widget: string
        - name: link
          label: Link
          widget: string
          type: url
        - name: logo
          label: Logo
          widget: image
        - name: background
          label: Background
          widget: image
